name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Alibaba Cloud ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/github-dashboard
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push to GHCR
        id: ghcr
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push to Alibaba Cloud ACR
        id: acr
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          # ACR rejects the OCI attestation config application/vnd.oci.empty.v1+json.
          # Export Docker media types without attestations; GHCR keeps its defaults.
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/github-dashboard:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/github-dashboard:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Verify published multi-platform images
        if: github.event_name != 'pull_request'
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/github-dashboard@${{ steps.ghcr.outputs.digest }}
          ACR_IMAGE: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/github-dashboard:${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$GHCR_IMAGE" --raw | jq -e '
            [.manifests[].platform | "\(.os)/\(.architecture)"]
            | contains(["linux/amd64", "linux/arm64"])
          ' > /dev/null
          docker buildx imagetools inspect "$ACR_IMAGE" --raw | jq -e '
            .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json"
            and ([.manifests[].platform | "\(.os)/\(.architecture)"] | sort)
              == ["linux/amd64", "linux/arm64"]
          ' > /dev/null
          echo "Verified GHCR and ACR images contain linux/amd64 and linux/arm64."
